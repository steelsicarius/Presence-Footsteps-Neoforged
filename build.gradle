plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// LWJGL aarch64 dev natives (see dependencies block at the bottom) are only
// published on Maven Central; the ModDevGradle plugin does not add it. Gradle
// resolves every artifact of a module from the first repository that has its
// metadata (Mojang's mirror, which lacks the arm64 natives), so the LWJGL group
// must be pinned to Central exclusively.
repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter { includeGroup "org.lwjgl" }
    }
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // applies to all the run configs above
        configureEach {
            // This host has no IPv6 support, and another server already occupies the default port.
            systemProperty 'java.net.preferIPv4Stack', 'true'
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Dev-only: LWJGL aarch64 natives so runClient can boot on ARM64 Linux dev hosts
// (this machine). Minecraft's dependency metadata only ships x64 linux natives.
// LWJGL 3.4+ picks the matching architecture at runtime from META-INF/<os>/<arch>/.
// Keep lwjglVersion in sync with the LWJGL version Minecraft depends on (see
// "./gradlew -q dependencies --configuration runtimeClasspath | grep lwjgl").
dependencies {
    def lwjglVersion = '3.4.1'
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-freetype:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-openal:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}:natives-linux-arm64"
}
